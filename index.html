<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Money Camp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
<style>
:root{
  --canvas:#EEF2FA; --panel:#FFFFFF; --panel-2:#F6F8FD;
  --ink:#141733; --muted:#5C6488; --line:#141733; --line-soft:#C9D2E8; --shadow:#141733;
  --mint:#00A36C; --tang:#FF6B35; --sun:#D99B00; --grape:#7C5CFF; --sky:#2F8DFF; --berry:#E4497F;
  --good:#00A36C; --bad:#E4497F; --on-accent:#FFFFFF;
  --r-lg:20px; --r-md:14px; --r-sm:9px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --canvas:#0E1124; --panel:#1A1F3D; --panel-2:#232949; --ink:#EEF1FF; --muted:#9AA3CC;
    --line:#3B4374; --line-soft:#3B4374; --shadow:#05070F;
    --mint:#2BD99A; --tang:#FF8A5C; --sun:#FFC940; --grape:#A98CFF; --sky:#5FAEFF; --berry:#FF6E9F;
    --good:#2BD99A; --bad:#FF6E9F; --on-accent:#0E1124;
  }
}
:root[data-theme="dark"]{
  --canvas:#0E1124; --panel:#1A1F3D; --panel-2:#232949; --ink:#EEF1FF; --muted:#9AA3CC;
  --line:#3B4374; --line-soft:#3B4374; --shadow:#05070F;
  --mint:#2BD99A; --tang:#FF8A5C; --sun:#FFC940; --grape:#A98CFF; --sky:#5FAEFF; --berry:#FF6E9F;
  --good:#2BD99A; --bad:#FF6E9F; --on-accent:#0E1124;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--canvas);color:var(--ink);font-family:"DM Sans","Segoe UI",system-ui,sans-serif;
  font-size:17px;line-height:1.55;-webkit-text-size-adjust:100%}
.wrap{max-width:760px;margin:0 auto;padding:22px 18px 72px}
h1,h2,h3,.num,.big{font-family:"Bricolage Grotesque","DM Sans",system-ui,sans-serif;font-weight:800;letter-spacing:-0.02em;line-height:1.05;margin:0}
p{margin:0 0 12px}
button{font-family:inherit;font-size:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.tnum{font-variant-numeric:tabular-nums}

.masthead{margin-bottom:26px}
.kicker{font-size:14px;color:var(--muted);margin:0 0 10px;font-weight:500}
h1{font-size:clamp(38px,11vw,62px)}
h1 .stack{display:block}
.tagline{margin:14px 0 0;font-size:18px;max-width:34ch;color:var(--muted)}
.tally{display:flex;align-items:center;gap:12px;margin-top:20px;border:2px solid var(--line);
  border-radius:var(--r-md);background:var(--panel);padding:11px 14px;box-shadow:3px 3px 0 var(--shadow)}
.tally-track{flex:1;height:12px;border-radius:99px;background:var(--panel-2);border:2px solid var(--line);overflow:hidden}
.tally-fill{height:100%;background:var(--mint);width:0%;transition:width .45s cubic-bezier(.2,.8,.3,1)}
.tally-text{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:15px;white-space:nowrap}

.board{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:26px}
@media(min-width:620px){.board{grid-template-columns:repeat(3,1fr)}}
.badge{position:relative;text-align:left;background:var(--panel);color:var(--ink);border:3px solid var(--line);
  border-radius:var(--r-lg);padding:14px 13px 15px;box-shadow:4px 4px 0 var(--shadow);
  display:flex;flex-direction:column;gap:7px;min-height:158px;transition:transform .12s ease,box-shadow .12s ease}
.badge:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--shadow)}
.badge .day-no{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:13px;background:var(--c);
  color:var(--on-accent);border-radius:99px;padding:2px 10px;align-self:flex-start;border:2px solid var(--line)}
.badge .emoji{font-size:30px;line-height:1}
.badge .b-title{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:18px;line-height:1.12}
.badge .b-sub{font-size:13.5px;color:var(--muted);line-height:1.35}
.badge.done{background:var(--panel-2)}
.badge .stamp{position:absolute;top:9px;right:9px;width:34px;height:34px;border-radius:50%;background:var(--mint);
  border:3px solid var(--line);display:grid;place-items:center;font-size:16px;color:var(--on-accent);transform:rotate(-12deg)}
.badge .stamp.pop{animation:stampIn .45s cubic-bezier(.2,1.5,.4,1)}
@keyframes stampIn{0%{transform:scale(2.4) rotate(22deg);opacity:0}60%{opacity:1}100%{transform:scale(1) rotate(-12deg);opacity:1}}

.day-view{display:none}
.day-view.on{display:block}
.home.off{display:none}
.hide{display:none}
.backbar{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.btn{border:3px solid var(--line);border-radius:var(--r-md);background:var(--panel);color:var(--ink);
  padding:9px 14px;font-weight:700;box-shadow:3px 3px 0 var(--shadow);transition:transform .1s ease,box-shadow .1s ease}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shadow)}
.btn.primary{background:var(--c,var(--sky));color:var(--on-accent)}
.btn.wide{width:100%;text-align:center;font-size:18px;padding:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed;box-shadow:none;transform:none;background:var(--panel-2);color:var(--muted)}
.btn.danger{background:var(--bad);color:var(--on-accent)}

.day-head{border-left:8px solid var(--c);padding-left:14px;margin-bottom:18px}
.day-head .eyebrow{font-size:14px;color:var(--muted);font-weight:500;margin-bottom:4px}
.day-head h2{font-size:clamp(27px,7.5vw,38px)}
.panel{background:var(--panel);border:3px solid var(--line);border-radius:var(--r-lg);padding:17px;
  box-shadow:4px 4px 0 var(--shadow);margin-bottom:18px}
.panel h3{font-size:20px;margin-bottom:9px}
.lesson p:last-child{margin-bottom:0}
.lesson strong{background:var(--c);color:var(--on-accent);padding:1px 6px;border-radius:6px;font-weight:700;white-space:nowrap}
.step-lab{font-size:13px;font-weight:700;color:var(--muted);margin-bottom:9px}
.gate{border-style:dashed}
.gate.settled{border-style:solid}

.row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
label.ctl{display:block;margin-bottom:16px}
label.ctl .lab{display:flex;justify-content:space-between;align-items:baseline;font-weight:700;font-size:15px;margin-bottom:7px}
label.ctl .val{font-family:"Bricolage Grotesque",sans-serif;font-size:21px;color:var(--c)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:14px;border-radius:99px;
  background:var(--panel-2);border:2px solid var(--line);margin:0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;border-radius:50%;
  background:var(--c);border:3px solid var(--line);margin-top:-1px}
input[type=range]::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:var(--c);border:3px solid var(--line)}
input[type=text]{width:100%;padding:11px 12px;border:3px solid var(--line);border-radius:var(--r-md);
  background:var(--panel-2);color:var(--ink);font-family:inherit;font-size:16px}

.jars{display:grid;gap:11px}
.jar{display:flex;align-items:center;gap:11px;border:3px solid var(--line);border-radius:var(--r-md);padding:10px;background:var(--panel-2)}
.jar .jicon{font-size:26px}
.jar .jbody{flex:1;min-width:0}
.jar .jname{font-weight:700;font-size:15.5px;line-height:1.2}
.jar .jnote{font-size:12.5px;color:var(--muted);line-height:1.3}
.jar .jpct{font-family:"Bricolage Grotesque",sans-serif;font-size:19px;min-width:52px;text-align:right}
.step{width:38px;height:38px;border-radius:var(--r-sm);border:3px solid var(--line);background:var(--panel);
  font-family:"Bricolage Grotesque",sans-serif;font-size:20px;line-height:1;color:var(--ink);display:grid;place-items:center;flex:none}
.pool{text-align:center;font-weight:700;margin:12px 0 4px;font-size:15px}
.pool b{font-family:"Bricolage Grotesque",sans-serif;font-size:22px;color:var(--c)}

.cards{display:grid;gap:10px}
.card-q{border:3px solid var(--line);border-radius:var(--r-md);padding:13px;background:var(--panel-2)}
.card-q .qtext{font-weight:700;margin-bottom:10px;font-size:16px}
.opts{display:flex;gap:9px;flex-wrap:wrap}
.opt{border:3px solid var(--line);border-radius:var(--r-sm);background:var(--panel);color:var(--ink);
  padding:9px 13px;font-weight:700;flex:1;min-width:100px}
.opt.pick-good{background:var(--good);color:var(--on-accent)}
.opt.pick-bad{background:var(--bad);color:var(--on-accent)}
.opt.pick-miss{background:var(--panel-2);color:var(--muted)}
.opt[disabled]{cursor:default}
.why{margin-top:10px;font-size:14.5px;line-height:1.45;color:var(--muted);display:none}
.why.on{display:block}

.guessbar{border:3px solid var(--line);border-radius:var(--r-md);background:var(--panel-2);padding:11px 13px;
  margin-bottom:16px;font-size:15px;line-height:1.4}
.guessbar b{font-family:"Bricolage Grotesque",sans-serif}
.guessbar .verdict{display:block;margin-top:6px;font-weight:700}
.guessbar .verdict.hit{color:var(--good)}
.guessbar .verdict.missed{color:var(--bad)}

.result{border:3px dashed var(--line);border-radius:var(--r-md);padding:14px;background:var(--panel-2);margin-top:14px}
.result .big{font-size:30px;display:block;color:var(--c)}
.result .lab2{font-size:13.5px;color:var(--muted);font-weight:500}
.split{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.stat{border:3px solid var(--line);border-radius:var(--r-md);padding:11px;background:var(--panel-2)}
.stat .big{font-size:25px;display:block;line-height:1.1}
.stat .lab2{font-size:12.5px;color:var(--muted);display:block;margin-top:3px;font-weight:500}

.bars{display:flex;align-items:flex-end;gap:7px;height:170px;margin:16px 0 8px;padding-top:6px}
.bcol{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;gap:4px}
.bstack{display:flex;flex-direction:column;justify-content:flex-end;height:100%;border-radius:6px 6px 0 0;
  overflow:hidden;border:2px solid var(--line);border-bottom:none}
.bseg{width:100%;transition:height .5s cubic-bezier(.2,.8,.3,1)}
.bseg.own{background:var(--sky)}
.bseg.earn{background:var(--mint)}
.blab{font-size:11px;text-align:center;color:var(--muted);font-weight:700;line-height:1.25}
.legend{display:flex;gap:14px;font-size:13px;flex-wrap:wrap;color:var(--muted);font-weight:500}
.key{display:inline-block;width:13px;height:13px;border-radius:4px;border:2px solid var(--line);vertical-align:-2px;margin-right:5px}
.ride{display:flex;align-items:center;gap:2px;height:46px;margin:4px 0 10px}
.ride span{flex:1;border-radius:2px}

table.mini{width:100%;border-collapse:collapse;font-size:14px;margin-top:10px}
table.mini th,table.mini td{padding:7px 6px;border-bottom:2px solid var(--line-soft);text-align:right}
table.mini th:first-child,table.mini td:first-child{text-align:left}
table.mini th{font-family:"Bricolage Grotesque",sans-serif;font-size:13px;color:var(--muted)}
.up{color:var(--good);font-weight:700}
.down{color:var(--bad);font-weight:700}
.headline{border-left:5px solid var(--c);padding:6px 0 6px 11px;margin:9px 0;font-size:14.5px;line-height:1.4}
.news{background:var(--panel-2);border:3px solid var(--line);border-radius:var(--r-md);padding:14px;font-size:15.5px;line-height:1.5}
.news h4{margin:0 0 8px;font-family:"Bricolage Grotesque",sans-serif;font-size:19px;line-height:1.15}
.pick-list{display:grid;gap:9px;margin-top:12px}
.pickable{text-align:left;border:3px solid var(--line);border-radius:var(--r-sm);background:var(--panel);
  color:var(--ink);padding:11px;font-size:15px;line-height:1.35}
.pickable.sel{background:var(--sky);color:var(--on-accent);font-weight:700}
.pickable.right{background:var(--good);color:var(--on-accent);font-weight:700}
.pickable.wrong{background:var(--bad);color:var(--on-accent);font-weight:700}
.script{background:var(--panel-2);border:3px solid var(--line);border-radius:var(--r-md);padding:14px;
  margin-top:14px;font-size:16px;line-height:1.6;display:none}
.script.on{display:block}
.script em{color:var(--c);font-style:normal;font-weight:700}
.done-bar{margin-top:26px}
.note{font-size:13.5px;color:var(--muted);line-height:1.45}

details.grown{margin-top:34px;border:3px solid var(--line);border-radius:var(--r-lg);background:var(--panel);
  box-shadow:4px 4px 0 var(--shadow);overflow:hidden}
details.grown summary{padding:15px 17px;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:18px;
  cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px}
details.grown summary::-webkit-details-marker{display:none}
details.grown summary::after{content:"+";font-size:24px;color:var(--muted)}
details.grown[open] summary::after{content:"\2013"}
.grown-body{padding:0 17px 17px;font-size:15.5px}
.grown-body h4{font-family:"Bricolage Grotesque",sans-serif;font-size:16px;margin:16px 0 6px}
.grown-body ul{margin:0 0 10px;padding-left:20px}
.grown-body li{margin-bottom:6px}
.cert{border:5px double var(--line);border-radius:var(--r-lg);background:var(--panel);padding:24px 18px;
  text-align:center;margin-top:26px;box-shadow:5px 5px 0 var(--shadow)}
.cert .seal{font-size:44px}
.cert h3{font-size:26px;margin:8px 0}
.cert .name{font-family:"Bricolage Grotesque",sans-serif;font-size:30px;color:var(--mint);
  border-bottom:3px solid var(--line);display:inline-block;padding:0 14px 3px;margin:6px 0 12px;min-width:60%}
.badge.locked{opacity:.5}
[tabindex="-1"]:focus{outline:none}
.badge .lock{position:absolute;top:9px;right:9px;font-size:19px}
.chip{font-size:11.5px;font-weight:700;color:var(--muted);margin-top:auto;padding-top:4px}
.notice{border:3px solid var(--line);border-radius:var(--r-md);background:var(--panel-2);padding:11px 13px;
  margin-top:14px;font-size:14.5px;font-weight:700}
.record{background:var(--panel);border:3px solid var(--line);border-radius:var(--r-lg);padding:16px;
  box-shadow:4px 4px 0 var(--shadow);margin-top:22px}
.record h3{font-size:18px;margin-bottom:11px}
.rec-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.receipt{border:3px solid var(--line);border-radius:var(--r-md);background:var(--panel-2);padding:15px;text-align:center;margin-bottom:13px}
.receipt .rname{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:20px;line-height:1.15}
.receipt .ramt{font-family:"Bricolage Grotesque",sans-serif;font-size:30px;color:var(--c);display:block;margin-top:5px}
.catgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.catbtn{border:3px solid var(--line);border-radius:var(--r-sm);background:var(--panel);color:var(--ink);
  padding:12px 8px;font-weight:700;font-size:15px;min-height:52px}
.catgrid .catbtn:last-child{grid-column:span 2}
.splitbar{display:flex;height:34px;border:3px solid var(--line);border-radius:var(--r-sm);overflow:hidden;margin:12px 0 8px}
.splitbar span{overflow:hidden}
.lockin{margin-top:12px}
.opt.chosen{background:var(--ink);color:var(--canvas)}
label.sw{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;margin-top:8px}
label.sw input{width:22px;height:22px;accent-color:var(--mint)}

.hud{display:flex;gap:9px;margin-top:12px;flex-wrap:wrap;align-items:center}
.coinpill{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--line);border-radius:99px;background:var(--panel);
  padding:5px 12px;font-weight:700;font-size:14.5px;white-space:nowrap}
.coinpill b{font-family:"Bricolage Grotesque",sans-serif;font-size:17px}
.btn.small{padding:5px 12px;font-size:14.5px;border-width:2px;border-radius:99px;box-shadow:2px 2px 0 var(--shadow)}
.flag{font-size:27px;letter-spacing:3px;margin-top:12px;line-height:1.2}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:18px}
.tab{border:3px solid var(--line);border-radius:var(--r-md);background:var(--panel);color:var(--ink);font-weight:700;
  font-size:12.5px;line-height:1.2;padding:8px 2px;display:flex;flex-direction:column;align-items:center;gap:3px;box-shadow:3px 3px 0 var(--shadow)}
.tab .temoji{font-size:21px;line-height:1}
.tab[aria-selected="true"]{background:var(--ink);color:var(--canvas);box-shadow:none;transform:translate(2px,2px)}
@media(min-width:620px){.tab{font-size:14.5px}}
.view{display:none;margin-top:26px}
.view.on{display:block}
.view .board{margin-top:0}
.floaty{position:fixed;left:50%;top:36%;z-index:70;pointer-events:none;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;
  font-size:24px;color:var(--ink);background:var(--panel);border:3px solid var(--line);border-radius:99px;padding:4px 16px;
  box-shadow:3px 3px 0 var(--shadow);transform:translateX(-50%);animation:floatUp 1.1s ease-out forwards}
@keyframes floatUp{0%{transform:translate(-50%,10px) scale(.7);opacity:0}20%{transform:translate(-50%,0) scale(1.1);opacity:1}
  70%{opacity:1}100%{transform:translate(-50%,-80px) scale(1);opacity:0}}
.confetti i{position:fixed;top:-20px;width:9px;height:14px;border-radius:2px;z-index:60;pointer-events:none;animation:fall 1.6s linear forwards}
@keyframes fall{to{top:105vh;transform:rotate(720deg)}}
.shop{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:620px){.shop{grid-template-columns:repeat(4,1fr)}}
.shopitem{border:3px solid var(--line);border-radius:var(--r-md);background:var(--panel-2);color:var(--ink);padding:12px 8px;
  display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:700;font-size:15px}
.shopitem .semoji{font-size:34px;line-height:1.1}
.shopitem .sprice{font-size:13.5px;color:var(--muted)}
.shopitem.own{background:var(--panel);border-style:dashed}
.shopitem.cant .semoji{filter:grayscale(1);opacity:.6}
.words{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:620px){.words{grid-template-columns:repeat(3,1fr)}}
.wcard{text-align:left;border:3px solid var(--line);border-radius:var(--r-md);background:var(--panel);color:var(--ink);
  padding:12px;min-height:118px;display:flex;flex-direction:column;gap:5px;box-shadow:3px 3px 0 var(--shadow);font-size:14px;line-height:1.35}
.wcard .wemoji{font-size:26px;line-height:1}
.wcard .wname{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:17px;line-height:1.1}
.wcard .wdef{color:var(--muted)}
.wcard.flip{background:var(--c);color:var(--on-accent)}
.wcard.flip .wdef{color:var(--on-accent)}
.wcard.shut{opacity:.5;box-shadow:none;border-style:dashed}
.mission{display:flex;align-items:center;gap:11px;border:3px solid var(--line);border-radius:var(--r-md);padding:10px;
  background:var(--panel-2);margin-top:10px;font-size:14.5px;line-height:1.35}
.mission .mtxt{flex:1;min-width:0}
.mission .mday{font-weight:700;font-size:12.5px;color:var(--muted);display:block}
.mission .btn{flex:none}
.mission.did{border-style:dashed}
.bonus-head{margin:26px 0 12px}
.bonus-head h3{font-size:22px}
.badge.bonus{border-style:dashed;min-height:150px}
.badge.bonus.open{border-style:solid;background:var(--panel-2)}
.stars{font-size:34px;letter-spacing:4px;text-align:center;line-height:1.1}
.stars .off{filter:grayscale(1);opacity:.3}
.msg{border:3px solid var(--line);border-radius:var(--r-md) var(--r-md) var(--r-md) 4px;background:var(--panel);padding:11px 13px;
  font-size:15.5px;line-height:1.4;margin-bottom:10px}
.msg .from{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:3px}
.flags{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}
.flags div{border:3px solid var(--line);border-radius:var(--r-sm);background:var(--panel-2);padding:9px;font-size:14px;line-height:1.3}
.flags b{display:block;font-family:"Bricolage Grotesque",sans-serif;font-size:16px}

  .view{display:none !important}#v-board{display:block !important}
  body{background:#fff}.cert{box-shadow:none;margin-top:40px}

@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}

</head>
<body>
<div class="wrap">
  <header class="masthead">
    <p class="kicker">Ten days, one badge each, five to ten minutes a sitting</p>
    <h1><span class="stack">Money</span><span class="stack">Camp</span></h1>
    <p class="tagline">The stuff banks teach heirs at 22, built for a ten-year-old who'd rather play than read.</p>
    <div class="tally"><div class="tally-track"><div class="tally-fill" id="tallyFill"></div></div>
      <div class="tally-text" id="tallyText">0 of 10 badges</div></div>
    <div class="hud">
      <span class="coinpill" title="Camp coins in your wallet">🪙 <b class="coin-count tnum">0</b> coins</span>
      <span class="coinpill" title="Camp coins in the vault">🏦 <b class="vault-count tnum">0</b> in the vault</span>
      <button class="btn small" id="mute">🔊 Sound on</button>
    </div>
    <div class="flag" id="flag" aria-label="Your camp flag stickers"></div>
    <div class="tabs" id="tabs" role="tablist">
      <button class="tab" role="tab" data-v="board" aria-selected="true"><span class="temoji">🏕️</span>Badges</button>
      <button class="tab" role="tab" data-v="fire" aria-selected="false"><span class="temoji">🔥</span>Campfire</button>
      <button class="tab" role="tab" data-v="post" aria-selected="false"><span class="temoji">🏪</span>Trading post</button>
      <button class="tab" role="tab" data-v="words" aria-selected="false"><span class="temoji">🃏</span>Word cards</button>
    </div>
  </header>
  <main class="home" id="home">
    <div class="view on" id="v-board">
      <div class="board" id="board"></div>
      <div id="bonusSlot"></div>
      <div id="extraSlot"></div>
      <div id="missionSlot"></div>
      <div id="certSlot"></div>
    </div>
    <div class="view" id="v-fire"></div>
    <div class="view" id="v-post"></div>
    <div class="view" id="v-words"></div>
    <details class="grown"><summary>Notes for the grown-up</summary><div class="grown-body" id="grownBody"></div></details>
  </main>
  <section class="day-view" id="dayView"></section>
</div>
<script>/* ================= helpers ================= */
const $=(s,r)=>(r||document).querySelector(s);
const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function money(n,dec){
  if(dec===undefined)dec=(Math.abs(n)>=100||Math.abs(n-Math.round(n))<0.005)?0:2;
  return '$'+Number(n).toLocaleString('en-US',{minimumFractionDigits:dec,maximumFractionDigits:dec});
}
const pick=a=>a[Math.floor(Math.random()*a.length)];
const TICK='\u2713 ',CROSS='\u2717 ';
const SEQ=[6,11,23,25,-3,-9,-4,12,34,9,8,26,25,-30,16,-16,1,1,20,7,-6,-2,-21,17,5,38,-17,3,50,27,26,7,4,53,32,7,4,-6,-20,-15,8,15,-9,28,9,-33,-4,38,27,-22,49,1,0,-15,-5,19,32,31,41,-13];

/* ================= saved progress ================= */
const KEY='moneycamp.v3';
const fresh=()=>({done:[],name:'',free:false,res:{},coins:0,vault:0,paid:{},stickers:[],missions:[],mute:false,fire:{best:0,last:''},bonus:{scam:{best:0,last:'',plays:0},job:{best:0,last:'',plays:0}}});
let state=fresh();
try{const raw=localStorage.getItem(KEY);if(raw){const p=JSON.parse(raw);
  if(p&&Array.isArray(p.done))state=Object.assign(state,p);
  if(!state.res||typeof state.res!=='object'||Array.isArray(state.res))state.res={};
  state.done=[...new Set(state.done.filter(n=>Number.isInteger(n)&&n>=1&&n<=10))];
  if(typeof state.name!=='string')state.name='';
  state.free=!!state.free;state.mute=!!state.mute;
  const whole=v=>Number.isFinite(v)&&v>0?Math.floor(v):0;
  state.coins=whole(state.coins);state.vault=whole(state.vault);
  if(!state.paid||typeof state.paid!=='object'||Array.isArray(state.paid))state.paid={};
  if(!Array.isArray(state.stickers))state.stickers=[];
  if(!Array.isArray(state.missions))state.missions=[];
  if(!state.fire||typeof state.fire!=='object')state.fire={best:0,last:''};
  state.fire.best=whole(state.fire.best);if(typeof state.fire.last!=='string')state.fire.last='';
  const B=(state.bonus&&typeof state.bonus==='object')?state.bonus:{};state.bonus={};
  ['scam','job'].forEach(k=>{const b=(B[k]&&typeof B[k]==='object')?B[k]:{};
    state.bonus[k]={best:whole(b.best),last:typeof b.last==='string'?b.last:'',plays:whole(b.plays)};});}}catch(e){state=fresh();}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}};
const isDone=n=>state.done.indexOf(n)>-1;
const isLocked=n=>!state.free&&n>1&&!isDone(n-1);
const R=n=>(state.res[n]=state.res[n]||{pred:null,score:null,carry:{}});
function carried(day,key,fallback){
  const r=state.res[day];
  return r&&r.carry&&r.carry[key]!==undefined?r.carry[key]:fallback;
}

/* ================= coins, sound, sparkle ================= */
const COIN='\u{1FA99}',RATE=0.10;
const calm=()=>{try{return matchMedia('(prefers-reduced-motion: reduce)').matches;}catch(e){return false;}};
let AC=null;
function sfx(k){
  if(state.mute)return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended')AC.resume();
    const n=AC.currentTime;
    const T=(f,at,d,type,v)=>{const o=AC.createOscillator(),g=AC.createGain();o.type=type||'triangle';o.frequency.value=f;
      g.gain.setValueAtTime(v||0.12,n+at);g.gain.exponentialRampToValueAtTime(0.001,n+at+d);
      o.connect(g);g.connect(AC.destination);o.start(n+at);o.stop(n+at+d+0.03);};
    if(k==='coin'){T(988,0,.08,'square',.05);T(1319,.07,.24,'square',.05);}
    else if(k==='good'){T(660,0,.1);T(880,.09,.2);}
    else if(k==='bad'){T(196,0,.26,'sawtooth',.06);}
    else if(k==='stamp'){T(523,0,.12);T(659,.11,.12);T(784,.22,.12);T(1047,.33,.4);}
    else if(k==='tap'){T(440,0,.05,'sine',.06);}
  }catch(e){}
}
function floaty(t){
  const f=document.createElement('div');f.className='floaty';f.setAttribute('aria-hidden','true');f.textContent=t;
  document.body.appendChild(f);setTimeout(()=>f.remove(),1150);
}
function confetti(){
  if(calm())return;
  const box=document.createElement('div');box.className='confetti';box.setAttribute('aria-hidden','true');
  const C=['var(--mint)','var(--tang)','var(--sun)','var(--grape)','var(--sky)','var(--berry)'];
  for(let i=0;i<70;i++){const s=document.createElement('i');
    s.style.cssText='left:'+(Math.random()*100)+'vw;background:'+pick(C)+';animation-delay:'+(Math.random()*.5)+'s;animation-duration:'+(1.2+Math.random())+'s';
    box.appendChild(s);}
  document.body.appendChild(box);setTimeout(()=>box.remove(),3200);
}
/* pays once per key, so replaying a day cannot farm coins. Returns what was paid. */
function gain(key,amt,quiet){
  if(key){if(state.paid[key])return 0;state.paid[key]=1;}
  state.coins+=amt;save();updateHud();
  floaty('+'+amt+' '+COIN);if(!quiet)sfx('coin');
  return amt;
}
const mark=(ok,key,amt)=>{if(!ok)sfx('bad');else if(!key||!gain(key,amt))sfx('good');};

/* reusable quiz: reveals the right answer on a miss, marks with a glyph not just colour */
function quiz(box,items,onDone,key){
  box.innerHTML=items.map((it,i)=>`<div class="card-q"><div class="qtext">${it.q}</div>
    <div class="opts">${it.o.map((o,j)=>`<button class="opt" data-i="${i}" data-j="${j}">${o}</button>`).join('')}</div>
    <div class="why" data-w="${i}">${it.why}</div></div>`).join('');
  let done=0,right=0;
  box.addEventListener('click',e=>{
    const b=e.target.closest('.opt');if(!b||b.disabled)return;
    const i=+b.dataset.i,j=+b.dataset.j,it=items[i],ok=(j===it.a);
    const btns=b.parentElement.querySelectorAll('.opt');
    btns.forEach(x=>x.disabled=true);
    b.textContent=(ok?TICK:CROSS)+b.textContent;b.classList.add(ok?'pick-good':'pick-bad');
    if(!ok){const c=btns[it.a];c.textContent=TICK+c.textContent;c.classList.add('pick-good');}
    box.querySelector('[data-w="'+i+'"]').classList.add('on');
    mark(ok,key?key+'.'+i:null,2);
    if(ok)right++;done++;
    if(done===items.length&&onDone)onDone(right,items.length);
  });
}

/* ================= the ten days ================= */
const DAYS=[];

/* ---------------- DAY 1 ---------------- */
DAYS.push({
  n:1,emoji:'\u{1F9FE}',color:'var(--tang)',title:'Where does it go?',sub:"Sort a real month, don't guess one",
  lesson:`<p>Before you decide what to do with money, find out what already happens to it.</p>
  <p>Nobody knows. Everybody thinks they know. The gap between <strong>the guess</strong> and the count is the most useful thing in this camp.</p>
  <p>Sam is ten and got $40 last month. Here is every single thing Sam bought. Sort it and see where it went.</p>`,
  predict:{q:"Out of Sam's $40, how much went on snacks and drinks?",
    o:['Under $6','$6 to $12','$12 to $20','Over $20'],a:2,
    note:'Lock in a guess before you sort a single one.'},
  build(el,ctx){
    const CAT=[['\u{1F36C}','Snacks'],['\u{1F3AE}','Games'],['\u{1F9F8}','Stuff'],['\u{1F381}','Gifts'],['\u{1F3E6}','Saved']];
    const COL=['var(--tang)','var(--sky)','var(--grape)','var(--berry)','var(--mint)'];
    const ITEMS=[['Slushie after school',2.50,0],['Chips, three bags',3.00,0],['Game skin',5.00,1],
      ['Sticker pack',2.50,2],['Ice cream van',3.50,0],['Birthday present for Dad',5.00,3],
      ['Vending machine drink',1.75,0],['Coins in an app',3.00,1],['Put in the tin',3.00,4],
      ['Candy at the corner store',2.25,0],['Fidget thing',4.00,2],['Bubble tea with Mia',4.50,0]];
    const tot=[0,0,0,0,0];let i=0,right=0,note='';
    el.innerHTML=`<div class="panel"><div class="row"><h3>Sam's month</h3><span class="tally-text" id="pg">1 of 12</span></div>
      <div id="stage"></div></div>`;
    function draw(){
      const stage=$('#stage',el);
      if(i<ITEMS.length){
        $('#pg',el).textContent=(i+1)+' of 12';
        stage.innerHTML=`${note?`<div class="notice" style="margin:0 0 13px">${note}</div>`:''}
          <div class="receipt"><span class="rname">${ITEMS[i][0]}</span><span class="ramt tnum">${money(ITEMS[i][1],2)}</span></div>
          <div class="catgrid">${CAT.map((c,j)=>`<button class="catbtn" data-j="${j}">${c[0]} ${c[1]}</button>`).join('')}</div>`;
        stage.querySelector('.catgrid').addEventListener('click',e=>{
          const b=e.target.closest('.catbtn');if(!b)return;
          const j=+b.dataset.j,truth=ITEMS[i][2];
          mark(j===truth,'s1.'+i,1);
          if(j===truth){right++;note='';}
          else note=CROSS+ITEMS[i][0]+' goes under '+CAT[truth][1]+'. Filed there so the count stays true.';
          tot[truth]+=ITEMS[i][1];i++;draw();
        });
      }else{
        const sum=tot.reduce((a,b)=>a+b,0),pct=Math.round(tot[0]/sum*100);
        $('#pg',el).textContent='all 12 sorted';
        stage.innerHTML=`<div class="splitbar" aria-hidden="true">${tot.map((t,j)=>t>0?`<span style="width:${t/sum*100}%;background:${COL[j]}"></span>`:'').join('')}</div>
          <div class="legend">${CAT.map((c,j)=>`<span><i class="key" style="background:${COL[j]}"></i>${c[1]} ${money(tot[j],2)} \u00b7 ${Math.round(tot[j]/sum*100)}%</span>`).join('')}</div>
          <div class="result"><span class="big tnum">${money(tot[0],2)}</span>
          <span class="lab2">went on snacks and drinks. That is ${pct}% of everything Sam got, in bits of $2 and $3.</span>
          <p class="note" style="margin:10px 0 0">Nothing here was a big purchase. That is the point. Small and often is how money leaves, and small and often is exactly what people forget when they guess. You filed ${right} of 12 into the right pile.</p></div>`;
        ctx.record({score:[right,12],carry:{snack:tot[0],pct:pct}});
        ctx.work();
      }
    }
    draw();
  }
});

/* ---------------- DAY 2 ---------------- */
DAYS.push({
  n:2,emoji:'\u{1F9E6}',color:'var(--sky)',title:'Need or want',sub:'Ten calls, and some are both',
  recall:{q:"Sam's snack money arrived in...",o:['one big purchase','lots of small ones'],a:1,
    why:'Twelve buys, none of them big. Small and often is how money leaves without being noticed.'},
  lesson:`<p>A need keeps you warm, fed, healthy or in school. A want is everything else. Wants are fine.</p>
  <p>Watch for the third kind. The coat is a need. The logo on the coat is a want. Same object, <strong>two different buys</strong>.</p>`,
  predict:{q:'Ten things are coming up. How many are pure needs, with no want mixed in?',
    o:['2','4','6','8'],a:1,note:'Lock in a number. You find out in a minute.'},
  build(el,ctx){
    const O=['Need','Want','Bit of both'];
    const Q=[
      {q:'A winter coat when it is snowing',a:0,why:'Staying warm is not optional.'},
      {q:'The $180 hoodie everyone at school has',a:2,why:'A hoodie is a need. That hoodie is a want. You are buying two things at once.'},
      {q:'Food in the fridge',a:0,why:'Yes. Easy one.'},
      {q:'Delivery, because the fridge is full but nothing looks good',a:1,why:'You are not buying food. You are buying not-cooking.'},
      {q:'Toothpaste',a:0,why:'Skipping it costs far more at the dentist later.'},
      {q:'A skin so your game character looks cooler',a:1,why:'A want, built by people paid to make it feel like a need.'},
      {q:'Shoes that fit',a:0,why:'Need.'},
      {q:'A fourth pair of shoes that fit',a:1,why:'The first pair was the need. This is a collection.'},
      {q:'Internet at home for schoolwork',a:2,why:'School runs on it. So does YouTube. The same wire does both jobs.'},
      {q:'A new phone when your phone works fine',a:1,why:'Newer is not the same as needed.'}];
    el.innerHTML=`<div class="panel"><div class="row"><h3>Make the call</h3><span class="tally-text" id="sc">0 of 10</span></div>
      <div class="cards" id="c"></div><div class="result" id="fin" style="display:none"></div></div>`;
    let n=0;
    quiz($('#c',el),Q.map(x=>({q:x.q,o:O,a:x.a,why:x.why})),(right,total)=>{
      $('#fin',el).style.display='block';
      $('#fin',el).innerHTML=`<span class="big tnum">${right} of ${total}</span>
        <span class="lab2">Four were pure needs. You guessed ${esc(ctx.guessLabel)}.</span>
        <p class="note" style="margin:10px 0 0">Wants are not the enemy. Paying for one by accident is.</p>`;
      ctx.record({score:[right,total]});ctx.verdict(ctx.guess===1);ctx.work();
    },'q2');
    $('#c',el).addEventListener('click',e=>{if(e.target.closest('.opt')){n=Math.min(10,n+1);$('#sc',el).textContent=n+' of 10';}});
  }
});

/* ---------------- DAY 3 ---------------- */
DAYS.push({
  n:3,emoji:'\u{1FAD9}',color:'var(--mint)',title:'Give every dollar a job',sub:'All of it. Not most of it.',
  recall:{q:'A $180 hoodie with a big logo is...',o:['a need','a want','a bit of both'],a:2,
    why:'The hoodie part is the need. The logo is the want. You pay for both in one go.'},
  lesson:`<p>Money with no plan disappears. Not stolen. Just spent on nothing you can remember a week later.</p>
  <p>So every dollar gets a job first. Four jars, and you pick the shares. There is no perfect split, but <strong>all of it on spend</strong> is how people end every month at zero, forever.</p>
  <p class="note">Money does not always turn up on time, or in the same amount. The jars are shares of whatever arrives, not promises.</p>`,
  predict:{q:'You get $10 a week. You put 30% of it in the Save jar. How many dollars is that?',
    o:['$1','$3','$7','$30'],a:1,note:'Work it out before you tap.'},
  build(el,ctx){
    const jars=[['\u{1F37F}','Spend','Snacks, games, fun now',0],['\u{1F3AF}','Save','One big thing you actually want',0],
      ['\u{1F331}','Grow','You do not touch this one. Day 6 shows why.',0],['\u{1F381}','Give','A gift, or someone who needs it',0]];
    let weekly=10;
    el.innerHTML=`<div class="panel">
      <label class="ctl"><span class="lab"><span>Money you get each week</span><span class="val tnum" id="wk">$10</span></span>
      <input type="range" id="wkR" min="1" max="40" step="1" value="10"></label>
      <p class="note" style="margin-bottom:13px">Nothing is assigned yet. Put all 100% of it to work.</p>
      <div class="jars" id="jars"></div><div class="pool" id="pool"></div><div class="result" id="out"></div></div>`;
    const used=()=>jars.reduce((s,j)=>s+j[3],0);
    function draw(){
      $('#jars',el).innerHTML=jars.map((j,i)=>`<div class="jar"><span class="jicon">${j[0]}</span>
        <span class="jbody"><span class="jname">${j[1]}</span><br><span class="jnote">${j[2]}</span></span>
        <button class="step" data-i="${i}" data-d="-10" aria-label="less ${j[1]}">\u2013</button>
        <span class="jpct tnum">${j[3]}%</span>
        <button class="step" data-i="${i}" data-d="10" aria-label="more ${j[1]}">+</button></div>`).join('');
      const left=100-used();
      $('#pool',el).innerHTML=left===0?'All of it has a job. That is the badge.':'Still with no job: <b class="tnum">'+left+'%</b>';
      const ready=(left===0);
      $('#out',el).innerHTML=`<div class="split">
        <div class="stat"><span class="big tnum">${money(weekly*jars[0][3]/100,2)}</span><span class="lab2">to spend each week</span></div>
        <div class="stat"><span class="big tnum">${money(weekly*jars[1][3]/100*52)}</span><span class="lab2">in the Save jar after a year</span></div></div>
        ${ready?`<p class="note" style="margin:11px 0 0">Your Grow jar is ${money(weekly*jars[2][3]/100,2)} a week. Day 6 starts from that number.</p>`:''}`;
      if(ready){
        ctx.record({carry:{grow:+(weekly*jars[2][3]/100).toFixed(2),spend:jars[0][3],save:jars[1][3],growPct:jars[2][3],give:jars[3][3],weekly:weekly}});
        ctx.work();
      }
    }
    $('#jars',el).addEventListener('click',e=>{const b=e.target.closest('.step');if(!b)return;
      const i=+b.dataset.i,d=+b.dataset.d,next=jars[i][3]+d;
      if(next<0||next>100||(d>0&&used()+d>100))return;
      jars[i][3]=next;draw();});
    $('#wkR',el).addEventListener('input',e=>{weekly=+e.target.value;$('#wk',el).textContent=money(weekly);draw();});
    draw();
  }
});

/* ---------------- DAY 4 ---------------- */
DAYS.push({
  n:4,emoji:'\u{1F34B}',color:'var(--sun)',title:'Make it',sub:'Pick a price, open the stand, live with it',
  recall:{q:'The Grow jar is the one you...',o:['spend first','never touch','give away'],a:1,
    why:'It only works if it is left alone. Touching it is the one way to break it.'},
  lesson:`<p>Every day so far has been about money that turned up. This one is about money you make.</p>
  <p>Selling is not the same as keeping. What comes in is <strong>revenue</strong>. What is left after lemons, cups and the stand is <strong>profit</strong>. Only the second one is yours.</p>
  <p>You get four hours. Pick a price and open. You will not see what happens until you commit.</p>`,
  predict:{q:'Three ways to make $20. Which pays the most per hour?',
    o:['Two hours of chores at $10 an hour','40 cups of lemonade at 50c, over four hours','Washing four cars at $5 each, three hours'],
    a:0,note:'The lemonade stand sells the most. Careful.'},
  build(el,ctx){
    let tries=[],best=0;
    el.innerHTML=`<div class="panel"><h3>Open your stand</h3>
      <p class="note" style="margin-bottom:13px">At 50c a cup the stand paid $1.50 an hour, worse than the $10 chores pay. Cups and lemons cost 35c each, and the stand costs $12 to set up. Beating chores is easy. Your stand can do twice that, but only at one narrow band of prices. <b>Get to $20 an hour.</b></p>
      <label class="ctl"><span class="lab"><span>Price per cup</span><span class="val tnum" id="pv">$1.00</span></span>
      <input type="range" id="pr" min="0.5" max="3" step="0.25" value="1"></label>
      <button class="btn primary wide" id="go">Open the stand at this price</button>
      <div id="out"></div></div>`;
    $('#pr',el).addEventListener('input',e=>{$('#pv',el).textContent=money(+e.target.value,2);});
    let busy=false;
    $('#go',el).addEventListener('click',()=>{
      if(busy)return;
      const p=+$('#pr',el).value,cups=Math.max(0,Math.round(140-40*p));
      if(calm()){show(p,cups);return;}
      /* a few seconds of trading, so the result feels earned rather than looked up */
      busy=true;const go=$('#go',el);go.disabled=true;go.textContent='Open for business...';
      const FACES=['\u{1F9D2}','\u{1F469}','\u{1F474}','\u{1F6B4}','\u{1F415}','\u{1F467}','\u{1F468}','\u{1F475}'];
      const t0=performance.now(),dur=1300;let last=-1;
      (function frame(now){
        const k=Math.min(1,(now-t0)/dur),sold=Math.round(cups*k);
        if(sold!==last){last=sold;

    const F=[['Sales grew 40%',1,'Real. The thing people want is selling much better.'],

      ['Profit fell 12%',1,'Real, and the tension in the story. Selling more, keeping less.'],
      ['It was announced on a Tuesday',0,'Noise.'],

      asked=true;check();

$('#v-fire').addEventListener('click',e=>{
  if(e.target.closest('#fireGo')){
    const pool=firePool();if(!pool.length)return;
    fire={qs:shuffle(pool).slice(0,8),i:0,right:0,streak:0,top:0,pick:null,pay:0,paidOut:state.fire.last===today()};
    sfx('tap');renderFire();return;}
  if(e.target.closest('#fireAgain')){fire=null;renderFire();return;}
  if(e.target.closest('#fireNext')){
    fire.i++;fire.pick=null;
    if(fire.i>=fire.qs.length){
      state.fire.best=Math.max(state.fire.best,fire.top);
      if(!fire.paidOut){state.fire.last=today();
        const pay=fire.right+(fire.right===fire.qs.length?3:0);
        if(pay){fire.pay=pay;gain(null,pay);}}
      save();if(fire.right===fire.qs.length){sfx('stamp');confetti();}
    }
    renderFire();return;}
  const b=e.target.closest('.opt');
  if(b&&fire&&fire.pick===null&&fire.i<fire.qs.length){
    const j=+b.dataset.j,ok=j===fire.qs[fire.i].a;
    fire.pick=j;
    if(ok){fire.right++;fire.streak++;fire.top=Math.max(fire.top,fire.streak);sfx('good');}else{fire.streak=0;sfx('bad');}
    renderFire();}
});

function openBonus(k){
  const b=BONUS[k];
  dayView.style.setProperty('--c',b.color);
  dayView.innerHTML=`<div class="backbar"><button class="btn" id="back">← All badges</button>
      <span class="coinpill" style="margin-left:auto">${COIN} <b class="coin-count tnum">${state.coins}</b></span></div>
    <div class="day-head"><div class="eyebrow">Bonus stage</div><h2 id="dayTitle" tabindex="-1">${b.emoji} ${b.title}</h2></div>
    <div id="stage"></div>`;
  $('#back',dayView).addEventListener('click',()=>closeDay());
  const stage=$('#stage',dayView),r=state.bonus[k];
  const payNote=()=>r.last===today()?'This stage has already paid out today. Play for the score, and come back tomorrow for coins.':'';
  /* records the play, pays once a day, returns the coins paid */
  function finish(score,coins){
    const first=r.last!==today();
    r.plays++;r.best=Math.max(r.best,score);if(first)r.last=today();save();
    if(first&&coins){gain(null,coins);return coins;}
    return 0;
  }
  if(k==='scam')scamStage();else jobStage();
  home.classList.add('off');mast.classList.add('hide');dayView.classList.add('on');window.scrollTo(0,0);
  try{$('#dayTitle',dayView).focus({preventScroll:true});}catch(e){}

  function scamStage(){
    stage.innerHTML=`<div class="panel lesson"><p>Lots of people want your money. Most ask fairly. Some use tricks, and a few just steal.</p>
      <p>Six messages are coming. Sort each one: a <strong>scam</strong> is trying to rob you. A <strong>sneaky trick</strong> is allowed, but it is built to make you spend without thinking. And some are simply fine.</p>
      <div class="flags"><div><b>⏰ Hurry</b>"In the next 10 minutes!"</div><div><b>\u{1F92B} Secret</b>"Do not tell anyone."</div>
        <div><b>\u{1F381} Too good</b>Free money, sure wins.</div><div><b>\u{1F511} Asks for</b>Money, passwords or codes.</div></div>
      <p class="note" style="margin:12px 0 0">Four red flags. One is enough to stop. ${payNote()||'One coin for each one you spot, plus three for all six.'}</p></div>
      <div class="panel"><div class="row"><h3>Six messages</h3><span class="tally-text" id="sn">0 of 6</span></div>
      <div class="cards" id="c"></div><div class="result" id="fin" style="display:none"></div>
      <button class="btn primary wide hide" id="again" style="margin-top:14px">Deal six new ones</button></div>`;
    const items=shuffle(SPOT).slice(0,6);let n=0;
    quiz($('#c',stage),items.map(m=>({q:`<div class="msg"><span class="from">${m[0]}</span>${m[1]}</div>`,o:KIND,a:m[2],why:m[3]})),(right,total)=>{
      const paid=finish(right,right+(right===total?3:0)),won=right===total?prize('spy'):'';
      if(right===total){sfx('stamp');confetti();}
      const fin=$('#fin',stage);fin.style.display='block';
      fin.innerHTML=`<span class="big tnum">${right} of ${total}</span>
        <span class="lab2">${right===total?'A clean sweep. Nobody is getting your money by accident.':'The ones you missed will turn up again. There are twenty in the deck.'}</span>
        <p class="note" style="margin:10px 0 0">${paid?'Paid '+paid+' coins. ':''}If something feels rushed, secret or too good, stop and show a grown-up. Asking is never the embarrassing part.</p>
        ${won?`<div class="notice">${won}</div>`:''}`;
      $('#again',stage).classList.remove('hide');
    });
    $('#c',stage).addEventListener('click',e=>{if(e.target.closest('.opt')){n=Math.min(6,n+1);$('#sn',stage).textContent=n+' of 6';}});
    $('#again',stage).addEventListener('click',()=>{scamStage();window.scrollTo(0,0);});
  }

  function jobStage(){
    /* two of each kind, so every summer is winnable and no two are the same */
    const deck=shuffle(['earn','bill','trap','fun'].reduce((a,t)=>a.concat(shuffle(JOB[t]).slice(0,2).map(c=>({kind:t,c:c}))),[]));
    let wk=0,cash=0,fun=0,traps=0,log=[],picked=null,started=false;
    const smile=n=>n?'\u{1F604}'.repeat(n):'none yet';
    function draw(){
      if(!started){
        stage.innerHTML=`<div class="panel lesson"><p>You have a summer job for eight weeks. It pays $${PAY} a week, but <strong>$${TAX} of tax</strong> comes out before you ever see it. Tax pays for roads, schools and firefighters. So $${PAY-TAX} lands in your pocket.</p>
          <p>You are saving for a <strong>$${GOAL} bike</strong>. Every week something happens, and you decide what to do about it.</p>
          <p class="note" style="margin:0">Three stars to win: finish with $${GOAL} or more, dodge every trap, and still have some fun. ${payNote()||'Three coins a star.'}</p></div>
          <button class="btn primary wide" id="start">Start week one</button>`;
        $('#start',stage).addEventListener('click',()=>{started=true;cash=PAY-TAX;sfx('coin');draw();});
        return;
      }
      if(wk>=8){end();return;}
      const card=deck[wk].c;
      stage.innerHTML=`<div class="panel"><div class="row"><h3>Week ${wk+1} of 8</h3><span class="tally-text tnum">${money(cash,2)}</span></div>
        <div class="goalbar" aria-hidden="true"><i style="width:${Math.max(0,Math.min(100,cash/GOAL*100))}%"></i></div>
        <p class="note" style="margin-bottom:12px">Payday: $${PAY}, minus $${TAX} tax, is $${PAY-TAX} in your pocket. Bike: $${GOAL}. Smiles: ${smile(fun)}</p>
        <div class="card-q"><div class="qtext" id="jq" tabindex="-1">${card.t}</div>
          <div class="opts" style="flex-direction:column">${card.o.map((o,j)=>{const no=picked===null&&o.need&&cash<o.need;
            return`<button class="opt ${picked===j?'chosen':''}" data-j="${j}" ${picked!==null||no?'disabled':''}>${o.t}${no?' (you do not have it)':''}</button>`;}).join('')}</div>
          <div class="why ${picked===null?'':'on'}" id="jw" aria-live="polite"></div></div>
        ${picked===null?'':`<button class="btn primary wide" id="next" style="margin-top:14px">${wk<7?'Next payday':'End of summer'}</button>`}</div>`;
      if(picked!==null){$('#jw',stage).innerHTML=log[log.length-1];
        $('#next',stage).addEventListener('click',()=>{wk++;picked=null;if(wk<8){cash+=PAY-TAX;}draw();window.scrollTo(0,0);});
        try{$('#next',stage).focus({preventScroll:true});}catch(e){}}
      else stage.querySelector('.opts').addEventListener('click',e=>{
        const btn=e.target.closest('.opt');if(!btn||btn.disabled)return;
        const o=card.o[+btn.dataset.j];let c=o.c,w=o.w;
        if(o.risk&&Math.random()<o.risk.p){c=o.risk.c;w=o.risk.w;}
        cash+=c;fun+=o.f||0;if(o.trap)traps++;
        log.push((o.trap?'<b class="down">'+CROSS+'Trap.</b> ':'')+w+(c?' <b class="tnum '+(c>0?'up':'down')+'">'+(c>0?'+':'−')+money(Math.abs(c),2)+'</b>':'')+(o.f?' \u{1F604}':''));
        picked=+btn.dataset.j;sfx(o.trap||c<=-25?'bad':c>0?'coin':'tap');draw();
      });
    }
    function end(){
      const s1=cash>=GOAL,s2=traps===0,s3=fun>=2,stars=(s1?1:0)+(s2?1:0)+(s3?1:0);
      const paid=finish(stars,stars*3),won=stars===3?prize('trophy'):'';
      if(stars===3){sfx('stamp');confetti();}
      const line=(ok,t)=>`<div class="mission ${ok?'':'did'}"><span style="font-size:22px" class="${ok?'':'stars'}"><span class="${ok?'':'off'}">⭐</span></span><span class="mtxt">${t}</span></div>`;
      stage.innerHTML=`<div class="panel"><div class="stars" aria-label="${stars} of 3 stars">${[0,1,2].map(i=>`<span class="${i<stars?'':'off'}">⭐</span>`).join('')}</div>
        <div class="result"><span class="big tnum">${money(cash,2)}</span>
          <span class="lab2">at the end of summer. Your wage added up to ${money(PAY*8)}, tax took ${money(TAX*8)} of it, and ${money((PAY-TAX)*8)} actually reached you.</span></div>
        ${line(s1,s1?'You can buy the $'+GOAL+' bike, with '+money(cash-GOAL,2)+' left over.':'You are '+money(GOAL-cash,2)+' short of the bike.')}
        ${line(s2,s2?'You dodged every trap.':'You walked into '+traps+' trap'+(traps===1?'':'s')+'. Each one looked like a good deal at the time.')}
        ${line(s3,s3?'And you still had a summer: '+smile(fun):'All work and no fun. Money is for something. Spend a little of it on purpose.')}
        <p class="note" style="margin:12px 0 0">${paid?'Paid '+paid+' coins. ':''}Every summer deals different cards. The moves stay the same: divide, multiply it out, ask what the waiting pays, keep a cushion.</p>
        ${won?`<div class="notice">${won}</div>`:''}
        <button class="btn primary wide" id="again" style="margin-top:14px">Work another summer</button></div>`;
      $('#again',stage).addEventListener('click',()=>{jobStage();window.scrollTo(0,0);});
    }
    draw();
  }
}

function showView(name){
  document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on',v.id==='v-'+name));
  document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected',t.dataset.v===name?'true':'false'));
  if(name==='fire')renderFire();else if(name==='post')renderPost();else if(name==='words')renderWords();
}

const board=$('#board'),dayView=$('#dayView'),home=$('#home'),mast=$('.masthead');
const extra=$('#extraSlot');

function stats(){
  let pT=0,pR=0,qR=0,qT=0;
  for(let n=1;n<=10;n++){const r=state.res[n];if(!r)continue;
    if(r.pred===true){pT++;pR++;}else if(r.pred===false){pT++;}
    if(r.score){qR+=r.score[0];qT+=r.score[1];}}
  return{pT:pT,pR:pR,qR:qR,qT:qT};
}
function tally(){
  const n=state.done.length;
  $('#tallyFill').style.width=(n*10)+'%';
  $('#tallyText').textContent=n+' of 10 badges';
}
function renderBoard(justDone,msg){
  board.innerHTML=DAYS.map(d=>{
    const lock=isLocked(d.n),r=state.res[d.n]||{};
    let chip='';
    if(isDone(d.n)){
      const bits=[];
      if(r.pred===true)bits.push(TICK+'called it');else if(r.pred===false)bits.push(CROSS+'missed the call');
      if(r.score)bits.push(r.score[0]+'/'+r.score[1]);
      chip=bits.length?`<span class="chip">${bits.join(' \u00b7 ')}</span>`:'';
    }
    return`<button class="badge ${isDone(d.n)?'done':''} ${lock?'locked':''}" style="--c:${d.color}" data-n="${d.n}"
      ${lock?`aria-disabled="true" aria-label="Day ${d.n}, ${d.title}. Locked until day ${d.n-1} is finished."`:''}>
      <span class="day-no">Day ${d.n}</span><span class="emoji">${d.emoji}</span>
      <span class="b-title">${d.title}</span><span class="b-sub">${d.sub}</span>${chip}
      ${lock?'<span class="lock">\u{1F512}</span>':isDone(d.n)?`<span class="stamp ${justDone===d.n?'pop':''}">\u2605</span>`:''}</button>`;}).join('');
  $('#bonusSlot').innerHTML=`<div class="bonus-head"><h3>Bonus stages</h3>
    <p class="note" style="margin:6px 0 0">Different every time. Play them as often as you like, and they pay coins once a day.</p></div>
    <div class="board" style="margin-top:0">${Object.keys(BONUS).map(k=>{const b=BONUS[k],lock=bonusLocked(k),r=state.bonus[k];
      return`<button class="badge bonus ${lock?'locked':'open'}" style="--c:${b.color}" data-b="${k}" ${lock?`aria-disabled="true" aria-label="${b.title}. Locked until day ${b.after} is finished."`:''}>
        <span class="day-no">Bonus</span><span class="emoji">${b.emoji}</span><span class="b-title">${b.title}</span><span class="b-sub">${b.sub}</span>
        <span class="chip">${lock?'Opens after Day '+b.after:r.plays?b.chip(r):'New. Not played yet'}</span>
        ${lock?'<span class="lock">\u{1F512}</span>':''}</button>`;}).join('')}</div>`;
  const s=stats();
  const rec=state.done.length||s.pT?`<div class="record"><h3>Your camp record</h3><div class="rec-grid">
    <div class="stat"><span class="big tnum">${s.pR} of ${s.pT}</span><span class="lab2">predictions called right</span></div>
    <div class="stat"><span class="big tnum">${s.qT?s.qR+' of '+s.qT:'\u2014'}</span><span class="lab2">quiz answers right</span></div></div>
    ${carried(3,'growPct',null)!==null?`<p class="note" style="margin:11px 0 0">Your split: ${carried(3,'spend',0)}% spend, ${carried(3,'save',0)}% save, ${carried(3,'growPct',0)}% grow, ${carried(3,'give',0)}% give.</p>`:''}
    ${carried(4,'bestHr',null)!==null?`<p class="note" style="margin:6px 0 0">Best price you found for the stand: ${money(carried(4,'bestHr',0),2)} an hour.</p>`:''}
    ${carried(9,'runs',0)?`<p class="note" style="margin:6px 0 0">You ran the five-year game ${carried(9,'runs',0)} times. The spread won ${carried(9,'spreadWins',0)}.</p>`:''}
    </div>`:'';
  extra.innerHTML=(msg?`<div class="notice">${msg}</div>`:'')+rec;
  tally();renderMissions();renderCert();updateHud();
}
board.addEventListener('click',e=>{
  const b=e.target.closest('.badge');if(!b)return;
  const n=+b.dataset.n;
  if(isLocked(n)){renderBoard(null,'Day '+(n-1)+' first. Each day starts with a question about the one before it.');return;}
  openDay(n);
});

$('#bonusSlot').addEventListener('click',e=>{
  const b=e.target.closest('.badge');if(!b)return;const k=b.dataset.b;
  if(bonusLocked(k)){renderBoard(null,BONUS[k].title+' opens once Day '+BONUS[k].after+' is stamped.');return;}
  openBonus(k);
});

function openDay(n){
  const d=DAYS[n-1];
  dayView.style.setProperty('--c',d.color);
  let worked=false,verdictShown=false,sel=null;
  dayView.innerHTML=`
    <div class="backbar"><button class="btn" id="back">\u2190 All badges</button>
      <span class="coinpill" style="margin-left:auto">${COIN} <b class="coin-count tnum">${state.coins}</b></span></div>
    <div class="day-head"><div class="eyebrow">Day ${d.n} of 10</div><h2 id="dayTitle" tabindex="-1">${d.emoji} ${d.title}</h2></div>
    ${d.recall?`<div class="panel gate" id="pRecall"><div class="step-lab">First, from last time</div>
      <div class="qtext" style="font-weight:700;margin-bottom:11px;font-size:16px">${d.recall.q}</div>
      <div class="opts" id="rOpts">${d.recall.o.map((o,i)=>`<button class="opt" data-i="${i}">${o}</button>`).join('')}</div>
      <div class="why" id="rWhy">${d.recall.why}</div></div>`:''}
    <div id="sLesson" class="${d.recall?'hide':''}">
      <div class="panel lesson" id="lessonBox">${d.lesson}${window.speechSynthesis?'<p style="margin:12px 0 0"><button class="btn small" id="speak">\u{1F50A} Read it to me</button></p>':''}</div>
      <div class="panel gate" id="pGuess"><div class="step-lab">Call it before you see it</div>
        <div class="qtext" style="font-weight:700;margin-bottom:11px;font-size:16px">${d.predict.q}</div>
        <div class="opts" id="gOpts">${d.predict.o.map((o,i)=>`<button class="opt" data-i="${i}">${o}</button>`).join('')}</div>
        <p class="note" style="margin:11px 0 0">${d.predict.note}</p>
        <div class="lockin"><button class="btn primary wide" id="lockBtn" disabled>Pick one first</button></div></div>
      <div id="sLab" class="hide">
        <div class="guessbar" id="gBar" aria-live="polite"></div><div id="lab"></div>
        <div class="done-bar"><button class="btn primary wide" id="done" disabled>Finish the activity first</button></div></div>
    </div>`;
  $('#back',dayView).addEventListener('click',()=>closeDay());

  if(d.recall){
    $('#rOpts',dayView).addEventListener('click',e=>{
      const b=e.target.closest('.opt');if(!b||b.disabled)return;
      const i=+b.dataset.i,ok=(i===d.recall.a),btns=$('#rOpts',dayView).querySelectorAll('.opt');
      btns.forEach(x=>x.disabled=true);
      b.textContent=(ok?TICK:CROSS)+b.textContent;b.classList.add(ok?'pick-good':'pick-bad');
      if(!ok){const c=btns[d.recall.a];c.textContent=TICK+c.textContent;c.classList.add('pick-good');}
      $('#rWhy',dayView).classList.add('on');
      mark(ok,'r'+n,2);
      $('#pRecall',dayView).classList.add('settled');
      $('#sLesson',dayView).classList.remove('hide');
    });
  }

  const ctx={guess:null,guessLabel:'',
    record(o){const r=R(n);
      if(o.score)r.score=o.score;
      if(o.carry)r.carry=Object.assign(r.carry||{},o.carry);
      save();},
    work(){if(worked)return;worked=true;
      const b=$('#done',dayView);b.disabled=false;b.textContent=isDone(n)?'Stamp it again':'Stamp my badge';
      if(!verdictShown&&d.predict.a>=0)ctx.verdict(ctx.guess===d.predict.a);},
    verdict(ok){if(verdictShown)return;verdictShown=true;
      R(n).pred=!!ok;save();if(ok)gain('p'+n,5);
      $('#gBar',dayView).innerHTML=`You called it: <b>${esc(ctx.guessLabel)}</b>
        <span class="verdict ${ok?'hit':'missed'}">${ok?TICK+'You were right.':CROSS+'It was '+esc(d.predict.o[d.predict.a])+'.'}</span>`;}};

  $('#gOpts',dayView).addEventListener('click',e=>{
    const b=e.target.closest('.opt');if(!b||b.disabled)return;
    $('#gOpts',dayView).querySelectorAll('.opt').forEach(x=>x.classList.remove('chosen'));
    b.classList.add('chosen');sel=+b.dataset.i;
    const lb=$('#lockBtn',dayView);lb.disabled=false;lb.textContent='Lock in "'+d.predict.o[sel]+'"';
  });
  $('#lockBtn',dayView).addEventListener('click',()=>{
    if(sel===null)return;
    ctx.guess=sel;ctx.guessLabel=d.predict.o[sel];
    $('#gOpts',dayView).querySelectorAll('.opt').forEach(x=>x.disabled=true);
    const lb=$('#lockBtn',dayView);lb.disabled=true;lb.textContent='Locked in';
    $('#pGuess',dayView).classList.add('settled');
    $('#gBar',dayView).innerHTML=`You called it: <b>${esc(ctx.guessLabel)}</b>`;
    $('#sLab',dayView).classList.remove('hide');
    d.build($('#lab',dayView),ctx);
  });

  const sp=$('#speak',dayView);
  if(sp)sp.addEventListener('click',()=>{
    const syn=window.speechSynthesis;
    if(syn.speaking){syn.cancel();sp.textContent='\u{1F50A} Read it to me';return;}
    const box=$('#lessonBox',dayView).cloneNode(true);const b=box.querySelector('#speak');if(b)b.parentElement.remove();
    const u=new SpeechSynthesisUtterance(box.textContent.replace(/\s+/g,' ').trim());u.rate=0.95;
    u.onend=u.onerror=()=>{sp.textContent='\u{1F50A} Read it to me';};
    syn.cancel();syn.speak(u);sp.textContent='\u23F9 Stop reading';
  });

  $('#done',dayView).addEventListener('click',()=>{
    let msg='';
    if(!isDone(n)){
      /* the vault pays before the badge coins land, so only coins that were waiting earn */
      const left=state.vault>0?Math.max(1,Math.round(state.vault*RATE)):0;
      state.vault+=left;state.done.push(n);save();
      gain('b'+n,10,true);sfx('stamp');confetti();
      msg='Badge '+n+' stamped. +10 coins.'
        +(left?' Your vault paid you <b>'+left+'</b> coin'+(left===1?'':'s')+' of interest while you were busy.'
              :' Coins in your wallet earn nothing. Coins in the vault earn 10% at every new badge. Have a look in the Trading post.')
        +' A new real-life mission and new word cards just unlocked.';
    }
    closeDay(n,msg);
  });
  home.classList.add('off');mast.classList.add('hide');dayView.classList.add('on');window.scrollTo(0,0);
  try{$('#dayTitle',dayView).focus({preventScroll:true});}catch(e){}
}
function closeDay(justDone,msg){
  const back=justDone||null;
  try{if(window.speechSynthesis)window.speechSynthesis.cancel();}catch(e){}
  dayView.classList.remove('on');dayView.innerHTML='';
  home.classList.remove('off');mast.classList.remove('hide');
  showView('board');
  renderBoard(justDone,msg);window.scrollTo(0,0);
  if(back){const b=board.querySelector('.badge[data-n="'+back+'"]');if(b)try{b.focus({preventScroll:true});}catch(e){}}
}

function renderCert(){
  const slot=$('#certSlot');
  if(state.done.length<10){slot.innerHTML='';return;}
  const s=stats(),lines=[];
  lines.push(`called <b>${s.pR} of ${s.pT}</b> predictions right, and got <b>${s.qR} of ${s.qT}</b> quiz answers`);
  if(carried(3,'growPct',null)!==null)lines.push(`gives ${carried(3,'growPct',0)}% of everything to the Grow jar`);
  if(carried(4,'bestHr',null)!==null)lines.push(`got a lemonade stand to ${money(carried(4,'bestHr',0),2)} an hour`);
  if(carried(7,'purse',null)!==null)lines.push(`walked away from the waiting machine with ${money(carried(7,'purse',0),2)}`);
  if(carried(6,'at60',null)!==null)lines.push(`is on track for ${money(carried(6,'at60',0))} by sixty, starting from ${money(carried(6,'weekly',5))} a week`);
  const mine=ALLST.filter(k=>state.stickers.indexOf(k[0])>-1).map(k=>k[1]).join(' ');
  if(state.missions.length)lines.push(`finished ${state.missions.length} of 10 missions out in the real world`);
  slot.innerHTML=`<div class="cert"><div class="seal">\u{1F3C5}</div>${mine?`<div class="flag" style="margin:0 0 6px">${mine}</div>`:''}<h3>All ten badges</h3>
    <div class="name" id="cn">${esc(state.name||'your name')}</div>
    <p class="note" style="margin:0 0 12px">${lines.map(l=>l.charAt(0).toUpperCase()+l.slice(1)).join('. ')}.</p>
    <input type="text" id="ni" placeholder="Type your name" value="${esc(state.name||'')}" style="max-width:280px">
    <p style="margin:14px 0 0"><button class="btn" id="printCert">\u{1F5A8}\uFE0F Print my certificate</button></p></div>`;
  $('#printCert').addEventListener('click',()=>window.print());
  $('#ni').addEventListener('input',e=>{state.name=e.target.value;save();$('#cn').textContent=e.target.value||'your name';});
}

$('#grownBody').innerHTML=`
  <p>Ten sittings of five to ten minutes. Each day runs in one order: a question about the day before, the idea, a prediction they must lock in, then the activity. The badge stays greyed out until the activity is genuinely finished, and days unlock one at a time because every recall question depends on the one before it.</p>
  <h4>What finishing actually takes</h4>
  <ul>
    <li>Day 1: all twelve of Sam's purchases sorted.</li>
    <li>Day 3: the jars adding to exactly 100%, because the day is called give every dollar a job.</li>
    <li>Day 4: a price that gets the stand to $20 an hour, twice what chores pay. They commit to a price before seeing the result, so they cannot just sweep the slider.</li>
    <li>Day 6: dragging past age 40, or the whole point never appears.</li>
    <li>Day 9: three runs minimum, because one run of a random game proves nothing.</li>
    <li>Day 10: both halves, the reading and the ask.</li>
  </ul>
  <h4>Why the prediction step matters</h4>
  <p>Being wrong out loud is what makes the reveal stick. If they slide straight to the answer they will nod and forget it. Let them commit even when they have no idea, and resist telling them first.</p>
  <h4>The one move worth more than all ten days</h4>
  <p>Match their Grow jar. Every dollar they leave alone, you add one. A ten-year-old cannot feel 7% a year, but they can feel you doubling it on the spot, and the thing they are practising is leaving money alone.</p>
  <h4>Take it off the screen</h4>
  <ul>
    <li>Day 1 uses Sam's month so there is something real to count. Then do theirs, with a week of actual receipts.</li>
    <li>Four labelled jars or envelopes. Digital money is invisible at this age.</li>
    <li>A real savings account in their name, and let them read the statement.</li>
    <li>Hand over a real budget, like school lunches or clothes for a term, and let them keep what is left. Let them run out, too.</li>
    <li>After Day 9, one share of a broad index fund in a custodial account beats any lecture about diversification.</li>
  </ul>
  <h4>Coins, the vault and the trading post</h4>
  <p>Right answers, called predictions, badges and missions pay camp coins, once each, so replaying a day cannot farm them. Coins buy stickers for the camp flag, and there are deliberately more stickers than a full camp can pay for. Coins left in the vault earn 10% at every new badge. So the camp's own currency runs the lessons for real: a budget that does not stretch, a reward for waiting, and a price for spending early. If they blow it all on the raccoon on Day 2, let them. Ask about it on Day 7.</p>
  <h4>Campfire, word cards and missions</h4>
  <ul>
    <li>The Campfire quiz pulls eight questions from badges already earned. Coming back to old material after a gap is what moves it into long-term memory, so it pays coins once a day, not once a sitting.</li>
    <li>Word cards unlock as badges are stamped. Ask them to explain one to you at dinner. Teaching it is the best test.</li>
    <li>Each badge unlocks one mission away from the screen. It is an honour system, and you are the honour. Do not let them tick it until it is done.</li>
    <li>Two bonus stages open part-way through and never run out. Scam Spotter (after Day 5) deals six new messages each time: scams, sales tricks and honest ones. Summer Job (after Day 8) is an eight-week run with tax taken from every payday, surprise bills, traps and treats, and it replays the camp's core lessons with different cards each time. They are the thing to send them back to a month after the last badge.</li>
    <li>Every lesson has a read-aloud button for younger or reluctant readers.</li>
  </ul>
  <h4>Honest about the numbers</h4>
  <p>Day 6 uses one fixed run of realistic market years averaging about 7%, with a 35% fall along the way, and shows the total in today's money as well. It is a made-up fifty years, not a forecast, and deliberately not a smooth curve.</p>
  <h4>Ages</h4>
  <p>Built for 9 to 12. Days 1, 2, 5 and 7 work from about 7. Day 8 is the stretch, worth coming back to at 12.</p>
  <label class="sw"><input type="checkbox" id="freeRoam" ${state.free?'checked':''}> Let them jump to any day</label>
  <p class="note" style="margin-top:6px">Off by default. The recall questions assume they went in order.</p>
  <p style="margin-top:16px"><button class="btn" id="reset">Erase everything</button></p>`;

$('#freeRoam').addEventListener('change',e=>{state.free=e.target.checked;save();renderBoard();});
let armed=false,armTimer=null;
$('#reset').addEventListener('click',e=>{
  const b=e.currentTarget;
  if(!armed){armed=true;b.classList.add('danger');b.textContent='Tap again to erase badges and record';
    armTimer=setTimeout(()=>{armed=false;b.classList.remove('danger');b.textContent='Erase everything';},5000);return;}
  clearTimeout(armTimer);armed=false;b.classList.remove('danger');b.textContent='Erase everything';
  const keep={free:state.free,mute:state.mute};state=Object.assign(fresh(),keep);fire=null;save();renderBoard();
});

renderBoard();
</script>
